name: family-tunnel

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

concurrency:
  group: family-tunnel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests qrcode pillow

      - name: Run tunnel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TUNNEL_LIFETIME_SECONDS: "21000"
          PUBLISH_CONFIG: "1"
        run: python scripts/run_tunnel.py

      - name: Upload config artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-config-${{ github.run_id }}
          path: vpn-config/
          retention-days: 3
          if-no-files-found: ignore
